[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gs-v2"
version = "0.1.0"
description = "A reproducible program-synthesis research platform"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gymnasium>=0.29.1,<1",
  "minigrid>=2.5.0,<3",
  "numpy>=1.26,<3",
  "openai>=1.0,<2",
  "Pillow>=10,<12",
  "pydantic>=2.11,<3",
  "textworld>=1.7,<2",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
llm-gs = "llm_gs.cli:main"

[dependency-groups]
dev = [
  "gradio==4.44.1",
  "huggingface-hub<1.0",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gs", "prog_policies"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_gs"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
