<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #64748b; }
.label { font-size: 15px; font-weight: 600; }
.value { font-size: 15px; font-weight: 700; }
.caption { font-size: 13px; fill: #64748b; }
.track { fill: #e8edf3; }
</style>
<rect width="100%" height="100%" fill="#fbfcfe" />
<text x="42" y="46" class="title">Adaptive Repair Breakdown</text>
<text x="42" y="72" class="subtitle">How ours reaches final success</text>
<rect x="72" y="120" width="756" height="54" rx="8" class="track" />
<rect x="72.00" y="120" width="82.69" height="54" fill="#5d84c4" />
<rect x="154.69" y="120" width="673.31" height="54" fill="#2f8f83" />
<rect x="80" y="226" width="16" height="16" fill="#5d84c4" />
<text x="104" y="239" class="label">first attempt success</text>
<text x="104" y="265" class="caption">14/128 (10.9%)</text>
<rect x="330" y="226" width="16" height="16" fill="#2f8f83" />
<text x="354" y="239" class="label">repaired by adaptive retry</text>
<text x="354" y="265" class="caption">114/128 (89.1%)</text>
<rect x="580" y="226" width="16" height="16" fill="#c84f4f" />
<text x="604" y="239" class="label">unrecovered</text>
<text x="604" y="265" class="caption">0/128 (0.0%)</text>
</svg>